name: Release

on:
  push:
    tags:
      - "v*"

permissions:
  contents: write

jobs:
  release:
    name: Build and publish Linux executable
    runs-on: ubuntu-24.04
    env:
      MIX_ENV: prod

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up Elixir and Erlang
        uses: erlef/setup-beam@v1
        with:
          elixir-version: "1.20.2"
          otp-version: "28.4"

      - name: Set up Zig
        uses: mlugg/setup-zig@v2
        with:
          version: "0.15.2"

      - name: Install dependencies
        run: mix deps.get

      - name: Build executable
        run: mix burrito.build

      - name: Generate checksum
        run: sha256sum socketything_linux_x86_64 > socketything_linux_x86_64.sha256
        working-directory: burrito_out

      - name: Publish GitHub release
        uses: softprops/action-gh-release@v3
        with:
          generate_release_notes: true
          files: |
            burrito_out/socketything_linux_x86_64
            burrito_out/socketything_linux_x86_64.sha256
